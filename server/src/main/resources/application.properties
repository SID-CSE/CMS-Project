spring.application.name=server
spring.profiles.default=prod
server.port=${PORT:9090}
spring.config.import=optional:file:.env[.properties]

# MySQL Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Frontend URL (used in password reset links)
app.frontend.base-url=${FRONTEND_BASE_URL}

# Mail Configuration (required for real reset link emails)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.dev-expose-verification-url=${MAIL_DEV_EXPOSE_VERIFICATION_URL:false}
app.mail.verification-expiration-minutes=${MAIL_VERIFICATION_EXPIRATION_MINUTES:30}
app.mail.verification-resend-seconds=${MAIL_VERIFICATION_RESEND_SECONDS:60}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@contify.local}

# Google Identity Services (the backend verifies the ID token)
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Cloudinary Configuration (for file uploads)
# Get your credentials from https://cloudinary.com
# IMPORTANT: These values MUST be set for file uploads to work
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
app.cloudinary.streaming-profile=full_hd
app.cloudinary.url-expiration-seconds=900

# Kafka Configuration
app.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.task-topic=${KAFKA_TASK_TOPIC:contify.task-events}
